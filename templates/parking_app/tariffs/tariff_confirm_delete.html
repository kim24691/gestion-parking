{% extends 'base.html' %}

{% block title %}Supprimer le Tarif{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm border-0 border-danger border-top border-4">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 fw-bold text-danger">
                    <i class="fa-solid fa-triangle-exclamation me-2"></i>Supprimer la Règle Tarifaire
                </h5>
            </div>
            <div class="card-body p-4">
                <p>Êtes-vous sûr de vouloir supprimer définitivement ce tarif ?</p>
                <div class="p-3 bg-light rounded border mb-4">
                    <strong>{{ tariff }}</strong>
                </div>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{% url 'tariff_list' %}" class="btn btn-outline-secondary">
                            <i class="fa-solid fa-arrow-left me-1"></i> Annuler
                        </a>
                        <button type="submit" class="btn btn-danger fw-bold px-4">
                            <i class="fa-solid fa-trash me-2"></i> Supprimer
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
